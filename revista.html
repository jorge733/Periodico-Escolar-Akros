<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
  >

  <meta
    name="description"
    content="Lector del Periódico Escolar Digital del Colegio Akros"
  >

  <title>
    El Desayuno | Colegio Akros
  </title>

  <link
    rel="stylesheet"
    href="revista.css"
  >
  <link rel="icon" type="image/png" href="assets/logo-akros.png">
</head>


<body>

  <main
    class="reader"
    id="reader"
  >

    <!-- ==================================================
         CABECERA
    =================================================== -->

    <header class="reader-header">

      <div class="header-left">

        <a
          href="index.html"
          class="back-button"
          aria-label="Volver al periódico"
          title="Volver al periódico"
        >
          ←
        </a>


        <div class="publication-brand">

          <img
            src="assets/logo-akros.png"
            alt="Colegio Akros"
            class="akros-logo"
          >

          <div class="publication-info">

            <strong id="publicationTitle">
              El Desayuno
            </strong>

            <span id="publicationEdition">
              Edición N.º 25 · Septiembre 2026
            </span>

          </div>

        </div>

      </div>


      <div class="header-actions">

        <button
          class="header-button desktop-only"
          id="zoomOutButton"
          type="button"
          aria-label="Alejar"
          title="Alejar"
        >
          −
        </button>


        <span
          class="zoom-value desktop-only"
          id="zoomValue"
        >
          100%
        </span>


        <button
          class="header-button desktop-only"
          id="zoomInButton"
          type="button"
          aria-label="Acercar"
          title="Acercar"
        >
          +
        </button>


        <button
          class="header-button"
          id="fullscreenButton"
          type="button"
          aria-label="Pantalla completa"
          title="Pantalla completa"
        >
          ⛶
        </button>


        <a
          class="download-button"
          id="downloadButton"
          href="assets/ediciones/desayuno/25/el-desayuno-25.pdf"
          download
          title="Descargar PDF"
        >

          <span class="download-text">
            Descargar
          </span>

          <span>
            ↓
          </span>

        </a>

      </div>

    </header>



    <!-- ==================================================
         ESCENARIO PRINCIPAL
    =================================================== -->

    <section
      class="magazine-stage"
      id="magazineStage"
    >

      <div class="stage-light"></div>


      <!-- ================================================
           FLECHA IZQUIERDA
      ================================================= -->

      <button
        class="navigation-arrow navigation-arrow-left"
        id="previousButton"
        type="button"
        aria-label="Página anterior"
        title="Página anterior"
      >
        ‹
      </button>



      <!-- ================================================
           ESCRITORIO · REVISTA
      ================================================= -->

      <div
        class="desktop-magazine"
        id="desktopMagazine"
      >

        <div
          class="magazine-book"
          id="magazineBook"
        >

          <!--
            JS construirá aquí:

            PORTADA:
            una página centrada

            INTERIOR:
            página izquierda + página derecha
          -->

        </div>

      </div>



      <!-- ================================================
           MÓVIL · UNA PÁGINA
      ================================================= -->

      <div
        class="mobile-magazine"
        id="mobileMagazine"
      >

        <div
          class="mobile-page-container"
          id="mobilePageContainer"
        >

          <img
            id="mobilePageImage"
            src=""
            alt="Página de la revista"
            draggable="false"
          >

        </div>

        <div
          class="swipe-indicator"
          aria-hidden="true"
        >
          <span>←</span>
          <span>Desliza para hojear</span>
          <span>→</span>
        </div>

      </div>



      <!-- ================================================
           FLECHA DERECHA
      ================================================= -->

      <button
        class="navigation-arrow navigation-arrow-right"
        id="nextButton"
        type="button"
        aria-label="Página siguiente"
        title="Página siguiente"
      >
        ›
      </button>


    </section>



    <!-- ==================================================
         BARRA INFERIOR
    =================================================== -->

    <footer class="reader-footer">

      <div class="footer-left">

        <strong id="currentPageLabel">
          Portada
        </strong>

        <span class="footer-separator">
          /
        </span>

        <span id="totalPagesLabel">
          7
        </span>

      </div>


      <div class="footer-center">

        <button
          class="footer-arrow"
          id="bottomPreviousButton"
          type="button"
          aria-label="Página anterior"
        >
          ←
        </button>


        <div
          class="page-dots"
          id="pageDots"
        ></div>


        <button
          class="footer-arrow"
          id="bottomNextButton"
          type="button"
          aria-label="Página siguiente"
        >
          →
        </button>

      </div>


      <div class="footer-help">

        <span class="desktop-help">
          Clic en una página para leer
        </span>

        <span class="mobile-help">
          Toca para ampliar
        </span>

      </div>

    </footer>



    <!-- ==================================================
         MODO LECTURA
    =================================================== -->

    <section
      class="reading-mode"
      id="readingMode"
      aria-hidden="true"
    >

      <!-- ================================================
           CABECERA MODO LECTURA
      ================================================= -->

      <header class="reading-header">

        <div class="reading-header-left">

          <button
            class="reading-close"
            id="readingCloseButton"
            type="button"
            aria-label="Volver a la revista"
          >
            ←
          </button>


          <div class="reading-title">

            <strong id="readingPublicationTitle">
              El Desayuno
            </strong>

            <span id="readingPageLabel">
              Página 2
            </span>

          </div>

        </div>


        <div class="reading-tools">

          <button
            class="reading-tool"
            id="readingZoomOutButton"
            type="button"
            aria-label="Alejar página"
            title="Alejar"
          >
            −
          </button>


          <span
            class="reading-zoom-value"
            id="readingZoomValue"
          >
            100%
          </span>


          <button
            class="reading-tool"
            id="readingZoomInButton"
            type="button"
            aria-label="Acercar página"
            title="Acercar"
          >
            +
          </button>

        </div>

      </header>



      <!-- ================================================
           ÁREA DE LECTURA
      ================================================= -->

      <div
        class="reading-scroll"
        id="readingScroll"
      >

        <div
          class="reading-page-wrapper"
          id="readingPageWrapper"
        >

          <img
            id="readingPageImage"
            src=""
            alt="Página ampliada de la revista"
            draggable="false"
          >

        </div>

      </div>



      <!-- ================================================
           NAVEGACIÓN EN MODO LECTURA
      ================================================= -->

      <button
        class="reading-navigation reading-navigation-left"
        id="readingPreviousButton"
        type="button"
        aria-label="Página anterior"
      >
        ‹
      </button>


      <button
        class="reading-navigation reading-navigation-right"
        id="readingNextButton"
        type="button"
        aria-label="Página siguiente"
      >
        ›
      </button>


      <div class="reading-bottom-info">

        <span id="readingBottomLabel">
          Página 2 de 7
        </span>

      </div>

    </section>



    <!-- ==================================================
         CARGANDO
    =================================================== -->

    <div
      class="reader-loader"
      id="readerLoader"
    >

      <div class="loader-logo">

        <img
          src="assets/logo-akros.png"
          alt=""
        >

      </div>

      <span>
        Abriendo publicación...
      </span>

    </div>


  </main>


  <!-- ====================================================
       IMPORTANTE:
       YA NO CARGAMOS StPageFlip
  ===================================================== -->
  <script src="ediciones.js"></script>
  <script src="revista.js"></script>

</body>

</html>
